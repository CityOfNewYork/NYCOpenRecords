<div id="concurrent-session-modal" class="modal" tabindex="-1" role="dialog"
     aria-labelledby="concurrent-session-label" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
                <h4 class="modal-title" id="concurrent-session-label">You are currently logged in to another session</h4>
            </div>
            <div class="modal-body">
                For your security, we have logged you out of your other active sessions.
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" type="button" id="continue-current-session" data-dismiss="modal">Continue</button>
            </div>
        </div>
    </div>
</div>
